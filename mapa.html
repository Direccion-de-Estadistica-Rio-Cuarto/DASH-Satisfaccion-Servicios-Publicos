<style>
:root{

  --ease-standard:cubic-bezier(.4,0,.2,1);
}
@media (prefers-color-scheme: dark){

.material-symbols-outlined{

}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{

a{color:inherit}

.topbar{flex-shrink:0;position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.topbar .wrap{display:flex;flex-direction:column;align-items:stretch;padding-top:14px;padding-bottom:12px}
.logo{display:flex;align-items:center;gap:10px;flex-shrink:0;margin-bottom:12px}
.logo img{width:auto;display:block}
.logo img.logo-gs{height:45px}
.topnav{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px}
.topnav a{display:flex;align-items:center;font-size:13.5px;font-weight:600;color:var(--ink-soft);text-decoration:none;white-space:nowrap;padding:4px 0;transition:color .2s var(--ease-standard),transform .15s var(--ease-standard)}
.topnav a:hover{color:var(--brand)}
.topnav a:active{transform:scale(.96)}
.topnav a .material-symbols-outlined{font-size:16px;margin-right:4px}
.metric-select{border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;background:var(--bg-alt);color:var(--ink);cursor:pointer;max-width:260px}

.app{flex:1;display:flex;min-height:0;position:relative}
#map{flex:1;min-width:0}
.leaflet-container{font-family:inherit;background:#eef2f5}
#panel{

  overflow-y:auto;padding:20px;
}
#panel .empty{color:#FF3CB2;font-size:13.5px;font-weight:600;padding-top:8px}
#panel .empty .material-symbols-outlined{display:block;font-size:32px;margin:0 0 10px;opacity:.7}
#panel h2{font-size:19px;font-weight:800;margin:0 0 2px;letter-spacing:-.01em}
#panel .panel-sub{font-size:12.5px;color:var(--ink-soft);font-weight:600;margin-bottom:16px}
.panel-hero{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:18px}
.panel-hero div{background:var(--bg);padding:12px}
.panel-hero strong{display:block;font-size:20px;font-weight:900}
.panel-hero span{font-size:11px;color:var(--ink-soft);font-weight:600}
.cat-block{margin-bottom:14px}
.cat-chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;padding:4px 10px;border-radius:999px;color:var(--ink);margin-bottom:8px;background:var(--tint-amarillo)}
.cat-chip .material-symbols-outlined{color:#c99a00}
.cat-chip .material-symbols-outlined{font-size:13px}
.stat-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:4px 0;font-size:12.5px}
.stat-row .label{color:var(--ink-soft);flex:1}
.stat-row .val{font-weight:800;white-space:nowrap}
.stat-row .val small{font-weight:400;color:var(--ink-soft);margin-left:4px}
.no-data-note{font-size:12.5px;color:var(--ink-soft);background:var(--bg-alt);border-radius:10px;padding:12px;margin-top:8px}
.legend{
  position:absolute;left:14px;bottom:14px;background:var(--bg);border:1px solid var(--line);border-radius:12px;
  padding:10px 14px;font-size:12px;box-shadow:var(--shadow);z-index:400;max-width:220px
}
.legend .legend-title{font-weight:700;margin-bottom:6px;font-size:11.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em}
.legend .legend-title .material-symbols-outlined{font-size:14px;vertical-align:-2px;margin-right:4px}
.stat-row .material-symbols-outlined{font-size:15px;vertical-align:-3px;margin-right:5px}
.icon-alumbrado{color:#F2C100}
.icon-residuos{color:#FF3CB2}
.icon-yuyos{color:#00C96B}
.icon-calles{color:#F27C00}
.icon-riego{color:#009DE0}
.legend-scale{display:flex;height:10px;border-radius:5px;overflow:hidden;margin-bottom:4px}
.legend-scale div{flex:1}
.legend-labels{display:flex;justify-content:space-between;color:var(--ink-soft);font-size:10.5px}
.legend-gray{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:11px;color:var(--ink-soft)}
.legend-gray i{width:10px;height:10px;border-radius:3px;background:#cbd0d6;display:inline-block}
@media (max-width:760px){
  #panel{position:absolute;right:0;top:0;bottom:0;z-index:500;box-shadow:-4px 0 16px rgba(0,0,0,.15)}

  .app{position:relative}

  { key: 'serv-yuyos', label: 'Limpieza de baldíos / yuyos (mal o muy mal)', icon: 'grass', iconCls: 'icon-yuyos', get: s => s.servicios.yuyos ? s.servicios.yuyos.pct : null, isPct: true },
  { key: 'serv-calle', label: 'Estado de calles (mal o muy mal)', icon: 'unpaved_road', iconCls: 'icon-calles', get: s => s.servicios.calle ? s.servicios.calle.pct : null, isPct: true },
  { key: 'serv-riego', label: 'Riego y desagües (mal o muy mal)', icon: 'water', iconCls: 'icon-riego', get: s => s.servicios.riego ? s.servicios.riego.pct : null, isPct: true },
];

const sel = document.getElementById('metricSelect');
METRICS.forEach(m => {
  const opt = document.createElement('option');
  opt.value = m.key; opt.textContent = m.label;
  sel.appendChild(opt);
});

function lerp(a,b,t){ return Math.round(a+(b-a)*t); }
function lerpColor(hex1,hex2,t){
  const c1=[1,3,5].map(i=>parseInt(hex1.slice(i,i+2),16));
  const c2=[1,3,5].map(i=>parseInt(hex2.slice(i,i+2),16));
  const c=c1.map((v,i)=>lerp(v,c2[i],t));
  return 'rgb('+c.join(',')+')';
}

let currentMetric = METRICS[0];

function colorFor(value, min, max){
  if(value==null) return '#cbd0d6';
  const t = max>min ? (value-min)/(max-min) : 0.5;
  return lerpColor('#dbf1fb', '#009DE0', Math.max(0,Math.min(1,t)));
}

function renderLegend(min, max){
  const steps = 5;
  const bars = [];
  for(let i=0;i<steps;i++){
    bars.push('<div style="background:'+colorFor(min+(max-min)*i/(steps-1), min, max)+'"></div>');
  }
  document.getElementById('legend').innerHTML =
    '<div class="legend-title"><span class="material-symbols-outlined '+currentMetric.iconCls+'">'+currentMetric.icon+'</span>'+currentMetric.label+'</div>'+
    '<div class="legend-scale">'+bars.join('')+'</div>'+
    '<div class="legend-labels"><span>'+(currentMetric.isPct? min.toFixed(0)+'%' : fmtN(Math.round(min)))+'</span><span>'+(currentMetric.isPct? max.toFixed(0)+'%' : fmtN(Math.round(max)))+'</span></div>'+
    '<div class="legend-gray"><i></i> Sin dato para esta métrica</div>';
}

let geoLayer;
const map = L.map('map', { zoomControl: true }).setView([-33.125, -64.35], 13);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO',
  maxZoom: 19,
}).addTo(map);

function styleFor(feature){
  const stats = feature.properties.stats;
  const value = stats ? currentMetric.get(stats) : null;
  return {
    fillColor: colorFor(value, currentMetric._min, currentMetric._max),
    fillOpacity: stats ? 0.72 : 0.35,
    color: stats ? '#0079ac' : '#8a919a',
    weight: 1.4,
    opacity: 0.9,
  };
}

function computeMinMax(metric){
  const values = SECTORES.features
    .map(f => f.properties.stats ? metric.get(f.properties.stats) : null)
    .filter(v => v != null);
  metric._min = values.length ? Math.min(...values) : 0;
  metric._max = values.length ? Math.max(...values) : 1;
}

function categoryBlock(chipClass, icon, title, rows){
  return '<div class="cat-block">'+
    '<span class="cat-chip '+chipClass+'"><span class="material-symbols-outlined">'+icon+'</span>'+title+'</span>'+
    rows.map(([label,val,extra,rowIcon,rowIconCls]) => (
      '<div class="stat-row"><span class="label">'+(rowIcon ? '<span class="material-symbols-outlined '+(rowIconCls||'')+'">'+rowIcon+'</span>' : '')+label+'</span><span class="val">'+val+(extra ? ' <small>('+extra+')</small>' : '')+'</span></div>'
    )).join('') +
  '</div>';
}

function statBlocksHTML(props){
  const s = props.stats;
  const items = [
    ['Alumbrado público', s.servicios.alumbrado, 'table_lamp', 'icon-alumbrado'],
    ['Recolección de residuos', s.servicios.basura, 'delete_sweep', 'icon-residuos'],
    ['Limpieza de baldíos / yuyos', s.servicios.yuyos, 'grass', 'icon-yuyos'],
    ['Estado de calles', s.servicios.calle, 'unpaved_road', 'icon-calles'],
    ['Riego y desagües', s.servicios.riego, 'water', 'icon-riego'],
  ];
  const withData = items.filter(([,v]) => v && v.pct != null);
  const avg = withData.length ? withData.reduce((sum,[,v]) => sum+v.pct, 0)/withData.length : null;
  return '<div class="panel-hero">'+
      '<div><strong>'+(s.muestras!=null ? fmtN(s.muestras) : 's/d')+'</strong><span>muestras recolectadas</span></div>'+
      '<div><strong>'+(avg!=null ? fmtPct(avg) : 's/d')+'</strong><span>calificación negativa promedio</span></div>'+
    '</div>'+
    categoryBlock('tint-amarillo','construction','Servicios urbanos',
      items.map(([label,v,icon,iconCls]) => [label, v ? fmtPct(v.pct) : 's/d', v ? v.count : null, icon, iconCls])
    );
}

function renderPanel(feature){
  const panel = document.getElementById('panel');
  const props = feature.properties;
  if(!props.stats){
    panel.innerHTML =
      '<h2>'+props.barrio+'</h2>'+
      '<div class="panel-sub">Sector vectorizado sin datos de relevamiento</div>'+
      '<div class="no-data-note">Este sector no tiene datos de Consulta Vecinal asociados.</div>';
    return;
  }
  panel.innerHTML =
    '<h2>'+props.barrio+'</h2>'+
    '<div class="panel-sub">'+props.meta+'</div>'+
    statBlocksHTML(props);
}

function redraw(){
  computeMinMax(currentMetric);
  if(geoLayer) geoLayer.remove();
  geoLayer = L.geoJSON(SECTORES, {
    style: styleFor,
    onEachFeature: (feature, layer) => {
      const stats = feature.properties.stats;
      const label = feature.properties.barrio || feature.properties.name;
      layer.bindTooltip(label + (stats ? ' — ' + (currentMetric.isPct ? fmtPct(currentMetric.get(stats)) : fmtN(currentMetric.get(stats))) : ' (sin datos)'), { sticky: true });
      layer.on('click', () => renderPanel(feature));
      layer.on('mouseover', () => layer.setStyle({ weight: 3 }));
      layer.on('mouseout', () => layer.setStyle({ weight: 1.4 }));
    }
  }).addTo(map);
  renderLegend(currentMetric._min, currentMetric._max);
}

function fitToZonas(){
  const bounds = geoLayer.getBounds();
  if(bounds.isValid()) map.fitBounds(bounds, { padding: [24,24] });
}

sel.addEventListener('change', () => {
  currentMetric = METRICS.find(m => m.key === sel.value);
  redraw();
});

redraw();
fitToZonas();
</script>
</body>
</html>
